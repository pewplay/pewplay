# Crea (o aggiorna) package-lock.json e lo committa sul branch scelto.
# Da lanciare a mano: Actions → Crea package-lock → Run workflow → scegli il branch.
# Conviene farlo prima su "preview" e poi fare il merge in "main".
# Il commit fatto da questo workflow NON fa partire il deploy (regola di GitHub):
# il sito si aggiorna al prossimo push, alla build notturna o col pulsante manuale.

name: Crea package-lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    name: package-lock.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Genera package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit
        run: |
          if git diff --quiet --exit-code -- package-lock.json 2>/dev/null && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json è già aggiornato: niente da fare." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Aggiorna package-lock.json"
          git push
          echo "**package-lock.json** creato/aggiornato su \`${GITHUB_REF_NAME}\`." >> "$GITHUB_STEP_SUMMARY"
