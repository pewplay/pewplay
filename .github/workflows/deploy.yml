# Build e pubblicazione di PewPlay su Cloudflare Pages.
#
#   main    = sito pubblico   → codice del sito da pewplay@main,    giochi dal loro main
#   preview = sito anteprima  → codice del sito da pewplay@preview, giochi dal loro preview
#
# Quando parte:
#   - push su main / preview di questo repo      → ricostruisce il sito corrispondente
#   - push su main / preview di un gioco         → idem (il gioco avvisa questo repo)
#   - ogni notte                                 → entrambi, ma pubblica solo se qualcosa è cambiato
#
# Alla fine di ogni run cancella i vecchi deploy su Cloudflare, sia di produzione sia di
# anteprima, e tiene solo gli ultimi (site.config.js → cloudflare.keepDeployments).
# Se manca package-lock.json la run lo crea e lo committa da sola sul branch del sito.
#   - a mano: Actions → Deploy → Run workflow    → scegli tu cosa ricostruire (o "solo pulizia")
#
# Secrets richiesti (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token Cloudflare con permesso "Account → Cloudflare Pages → Edit"
#   CLOUDFLARE_ACCOUNT_ID  ID del tuo account Cloudflare
#   GH_READ_TOKEN          (facoltativo) serve solo se alcuni giochi stanno in repo privati

name: Deploy

# Nome della run nella lista Actions: dice subito COSA la ha avviata e DOVE pubblica.
# Nota: le run avviate da un gioco risultano sempre sul branch "main" di questo repo
# (regola di GitHub per repository_dispatch), anche quando pubblicano l'anteprima.
run-name: >-
  ${{ github.event_name == 'repository_dispatch' && format('Gioco {0} ({1}) → {2}', github.event.client_payload.repo, github.event.client_payload.branch, github.event.client_payload.branch == 'preview' && 'PREVIEW' || 'PRODUCTION')
  || github.event_name == 'push' && format('Sito ({0}) → {1}', github.ref_name, github.ref_name == 'preview' && 'PREVIEW' || 'PRODUCTION')
  || github.event_name == 'workflow_dispatch' && format('Manuale → {0}', inputs.target)
  || 'Build notturna → PRODUCTION + PREVIEW' }}

on:
  push:
    branches: [main, preview]
    paths-ignore: ['**.md']
  repository_dispatch:
    types: [game-updated]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Cosa ricostruire'
        type: choice
        options: [entrambi, production, preview, solo pulizia]
        default: entrambi

permissions:
  contents: read

jobs:
  plan:
    name: Scegli cosa ricostruire
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BRANCH: ${{ github.ref_name }}
          GAME: ${{ github.event.client_payload.repo }}
          GAME_BRANCH: ${{ github.event.client_payload.branch }}
          INPUT: ${{ github.event.inputs.target }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT" in
            push)                want="$PUSH_BRANCH" ;;
            repository_dispatch) echo "Aggiornato il gioco $GAME (branch $GAME_BRANCH)"; want="$GAME_BRANCH" ;;
            workflow_dispatch)   case "$INPUT" in production) want=main ;; preview) want=preview ;; "solo pulizia") want="" ;; *) want="main preview" ;; esac ;;
            *)                   want="main preview" ;;
          esac

          items=""
          for b in $want; do
            case "$b" in
              main)    items="$items,{\"target\":\"production\",\"ref\":\"main\"}" ;;
              preview)
                # API autenticata: funziona anche se il repo pewplay è privato
                if gh api "repos/$REPO/branches/preview" --silent 2>/dev/null; then
                  items="$items,{\"target\":\"preview\",\"ref\":\"preview\"}"
                else
                  echo "::warning::Il repo pewplay non ha il branch 'preview': anteprima saltata. Crealo una volta con: git push origin main:preview"
                fi ;;
              *) echo "::notice title=Niente da pubblicare::Il branch '$b' non è collegato a nessun sito (pubblicano solo main e preview)." ;;
            esac
          done
          echo "matrix=[${items#,}]" >> "$GITHUB_OUTPUT"
          [ -n "$items" ] && echo "any=true" >> "$GITHUB_OUTPUT" || echo "any=false" >> "$GITHUB_OUTPUT"

  deploy:
    name: ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Un solo build alla volta per ogni sito, in coda:
    #  - il build in corso non viene mai interrotto (nessun deploy lasciato a metà);
    #  - tutti i push che arrivano nel frattempo si riducono a UN solo build successivo
    #    (GitHub tiene al massimo 1 run in attesa: le più vecchie in attesa vengono annullate).
    # Ogni build ricostruisce il sito con tutti i giochi, quindi l'ultimo include tutte le modifiche.
    # Esempio: 27 giochi pubblicati di fila → 2 build per sito, non 27.
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: write   # solo per committare package-lock.json se manca
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}         # codice del sito: main per il pubblico, preview per l'anteprima
          persist-credentials: false     # la build usa il suo token: evita credenziali doppie

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache dipendenze npm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      # Con package-lock.json installa sempre le stesse versioni (npm ci).
      # Se manca (o non corrisponde più a package.json) lo crea con npm install.
      - name: Installa dipendenze
        id: deps
        run: |
          if [ -f package-lock.json ] && npm ci --no-audit --no-fund; then
            exit 0
          fi
          echo "Creo/aggiorno package-lock.json"
          npm install --no-audit --no-fund
          echo "lock=changed" >> "$GITHUB_OUTPUT"

      # Committa il package-lock.json appena creato sul branch del sito (main o preview).
      # Il commit fatto da GitHub Actions non fa ripartire il deploy. Se non riesce, ci riprova alla run dopo.
      - name: Salva package-lock.json nel repo
        if: steps.deps.outputs.lock == 'changed'
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ matrix.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then echo "package-lock.json già aggiornato"; exit 0; fi
          git commit -m "Aggiorna package-lock.json"
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${REF}"
          echo "**package-lock.json** creato e salvato su \`${REF}\`." >> "$GITHUB_STEP_SUMMARY"

      # I giochi scaricati restano in cache: vengono riscaricati solo quelli con nuovi commit
      - name: Cache giochi
        uses: actions/cache@v5
        with:
          path: .cache/${{ matrix.target }}
          key: games-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: games-${{ matrix.target }}-

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GH_READ_TOKEN || github.token }}
          PEWPLAY_ORG: ${{ github.repository_owner }}
        run: node src/build.js --target ${{ matrix.target }}

      - name: Pubblica su Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Salta il deploy se online c'è già la stessa versione; se lo lanci a mano pubblica sempre.
        run: node src/deploy.js --target ${{ matrix.target }} ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

  # Alla fine di OGNI run (anche se un deploy è fallito o è stato saltato) cancella i vecchi
  # deploy di produzione E di anteprima e tiene solo gli ultimi (site.config.js → cloudflare.keepDeployments).
  # Il deploy online e quelli in corso non vengono mai toccati. Se non riesce, ci riprova alla run dopo.
  cleanup:
    name: Cancella i vecchi deploy
    needs: [plan, deploy]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            site.config.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cancella i vecchi deploy da Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node src/cleanup.js
