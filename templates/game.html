<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  {{HEAD_TAGS}}
  {{SEO_TAGS}}
  {{JSON_LD}}
  <style>
    {{STYLES}}

    /* ── LANDING PAGE ─────────────────────────── */
    .landing {
      width: 100%;
    }

    /* ── GAME CONTAINER ───────────────────────── */
    .game-container {
      position: relative;
      width: 100%;
      height: calc(100vh - var(--header-h));
      overflow: hidden;
      background: #000;
    }
    .game-container iframe {
      width: 100%; height: 100%;
      border: none;
      display: block;
    }

    /* ── GAME INFO ─────────────────────────────── */
    .game-info {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 20px 10px;
    }
    .game-info h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.4px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .game-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .game-meta .tag {
      display: inline-block;
      padding: 5px 12px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .2px;
    }
    .game-desc {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text-2);
      margin-bottom: 28px;
    }

    /* ── RELATED GAMES ─────────────────────────── */
    .related {
      max-width: 900px;
      margin: 20px auto 0;
      padding: 0 20px 60px;
    }
    .related h2 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
    }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
    }
    @media (min-width: 600px) {
      .related-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }
    .related-card {
      aspect-ratio: 1;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      background: var(--bg-card);
      text-decoration: none;
      display: block;
      box-shadow: var(--shadow-card);
      transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
    }
    .related-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: var(--shadow-card-hover);
    }
    .related-card img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .related-card__name {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 22px 8px 8px;
      background: var(--overlay-name);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      line-height: 1.3;
    }

    /* ── LOADING SPLASH ───────────────────────── */
    .splash {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      transition: opacity .4s, visibility .4s;
    }
    .splash.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-icon {
      width: 100px; height: 100px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
      margin-bottom: 18px;
    }
    .splash-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .splash-sub {
      font-size: 13px;
      color: var(--text-3);
      margin-bottom: 24px;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <a href="/" class="header-btn" aria-label="Back to home" title="Home">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <span class="game-title">{{TITLE}}</span>
    <span class="spacer"></span>
    {{THEME_TOGGLE}}
    <button class="header-btn" id="fs-btn" aria-label="Fullscreen" title="Fullscreen">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
    </button>
  </header>

  <!-- ── LANDING PAGE (visible to Google) ──────── -->
  <main class="landing" id="landing">
    <div class="game-container" id="game-container">
      <div class="splash" id="splash">
        <img class="splash-icon" src="{{GAME_IMG}}" alt="{{TITLE}}" width="100" height="100" fetchpriority="high">
        <div class="splash-title">{{TITLE}}</div>
        <div class="splash-sub">Loading…</div>
        <div class="spinner"></div>
      </div>
      <iframe id="game-frame" src="internal.html" allowfullscreen title="{{TITLE}}"></iframe>
    </div>

    <div class="game-info">
      <h1>{{TITLE}}</h1>
      <div class="game-meta">
        <span class="tag">{{CATEGORY}}</span>
        {{KEYWORD_TAGS}}
      </div>
      <p class="game-desc">{{DESCRIPTION}}</p>
    </div>

    {{RELATED_SECTION}}
  </main>

  <script>
    (function(){
      var frame   = document.getElementById('game-frame');
      var splash  = document.getElementById('splash');
      var landing = document.getElementById('landing');
      var header  = document.querySelector('header');

      function applyHeaderOffset() {
        var h = header.offsetHeight;
        landing.style.marginTop = h + 'px';
        document.getElementById('game-container').style.height = (window.innerHeight - h) + 'px';
      }
      applyHeaderOffset();
      window.addEventListener('resize', applyHeaderOffset);

      frame.addEventListener('load', function() { splash.classList.add('loaded'); });
      setTimeout(function() { splash.classList.add('loaded'); }, 6000);

      document.getElementById('fs-btn').addEventListener('click', function() {
        if (frame.requestFullscreen) frame.requestFullscreen();
        else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
      });
    })();
  </script>
  {{THEME_SCRIPT}}
</body>
</html>
