<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  {{HEAD_TAGS}}
  {{SEO_TAGS}}
  {{JSON_LD}}
  <style>
    {{STYLES}}
    .landing{width:100%;margin-top:0}.game-shell{position:relative;width:100%;padding-top:var(--header-h);background:var(--bg)}
    .game-shell:fullscreen,.game-shell:-webkit-full-screen{width:100vw;height:100vh;height:100dvh;padding-top:48px;overflow:hidden;background:var(--bg);--header-h:48px}
    .game-shell:fullscreen header,.game-shell:-webkit-full-screen header{position:absolute;height:48px}
    .game-shell:fullscreen .header-inner,.game-shell:-webkit-full-screen .header-inner{height:48px}
    .game-shell:fullscreen .game-container,.game-shell:-webkit-full-screen .game-container{height:calc(100vh - 48px);height:calc(100dvh - 48px)}
    .game-container{position:relative;width:100%;height:calc(100vh - var(--header-h));min-height:420px;overflow:hidden;background:#07070b}.game-container iframe{width:100%;height:100%;border:0;display:block;background:#07070b}
    .game-page{max-width:1120px;margin:0 auto;padding:34px 20px 70px}.game-info-card{display:grid;grid-template-columns:auto 1fr;gap:18px;padding:20px;border:1px solid var(--border);border-radius:20px;background:var(--surface-elevated);box-shadow:var(--shadow-sm)}
    .game-info__icon{width:76px;height:76px;object-fit:cover;border-radius:16px;box-shadow:var(--shadow-md)}.game-info h1{font-size:clamp(23px,4vw,30px);font-weight:800;letter-spacing:-.7px;margin-bottom:8px}.game-meta{display:flex;flex-wrap:wrap;gap:7px}.tag{display:inline-flex;padding:5px 10px;border:1px solid var(--border);background:var(--accent-soft);color:var(--accent);border-radius:999px;font-size:11px;font-weight:700}.game-desc{grid-column:1/-1;color:var(--text-2);font-size:15px;line-height:1.7;padding-top:2px}
    .related{margin-top:34px}.related h2{font-size:19px;font-weight:800;letter-spacing:-.35px;margin-bottom:14px}.related-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:560px){.related-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}@media(min-width:900px){.related-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
    .related-card{text-decoration:none;color:inherit;min-width:0}.related-card__media{aspect-ratio:1;overflow:hidden;border:1px solid var(--border-soft);border-radius:16px;background:var(--bg-card);box-shadow:var(--shadow-card);transition:transform .2s,box-shadow .2s,border-color .2s}.related-card img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .25s}.related-card__name{display:block;padding:8px 2px 0;color:var(--text);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.related-card__category{display:block;padding:3px 2px 0;color:var(--text-3);font-size:10px;font-weight:600}.related-card:hover .related-card__media,.related-card:focus-visible .related-card__media{transform:translateY(-3px);box-shadow:var(--shadow-card-hover);border-color:var(--accent)}.related-card:hover img{transform:scale(1.035)}
    .splash{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);transition:opacity .35s,visibility .35s}.splash.loaded{opacity:0;visibility:hidden;pointer-events:none}.splash-icon{width:92px;height:92px;border-radius:22px;object-fit:cover;box-shadow:var(--shadow-lg);margin-bottom:18px}.splash-title{font-size:17px;font-weight:800;margin-bottom:5px}.splash-sub{font-size:12px;color:var(--text-3);margin-bottom:20px}.spinner{width:23px;height:23px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:520px){.game-container{min-height:360px}.game-page{padding:22px 14px 50px}.game-info-card{grid-template-columns:58px 1fr;padding:15px;gap:13px;border-radius:17px}.game-info__icon{width:58px;height:58px;border-radius:13px}.game-info h1{font-size:21px}.game-desc{font-size:14px}.header-game-title{font-size:13px}}
  </style>
</head>
<body>
  <section class="game-shell" id="game-shell" aria-label="{{TITLE}} game player">
    <header class="site-header">
      <div class="header-inner">
        <a href="/" class="header-btn" aria-label="Back to home" title="Home"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
        <span class="header-game-title">{{TITLE}}</span><span class="spacer"></span>{{THEME_TOGGLE}}
        <button class="header-btn" id="fs-btn" aria-label="Enter fullscreen" title="Fullscreen"><svg class="fs-enter" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><svg class="fs-exit" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg></button>
      </div>
    </header>
    <div class="game-container" id="game-container"><div class="splash" id="splash"><img class="splash-icon" src="{{GAME_IMG}}" alt="" width="92" height="92" fetchpriority="high"><div class="splash-title">{{TITLE}}</div><div class="splash-sub">Loading game…</div><div class="spinner"></div></div><iframe id="game-frame" src="internal.html" allow="fullscreen; gamepad; autoplay" title="{{TITLE}}"></iframe></div>
  </section>

  <main class="landing"><div class="game-page"><article class="game-info-card"><img class="game-info__icon" src="{{GAME_IMG}}" alt="" width="76" height="76"><div class="game-info"><h1>{{TITLE}}</h1><div class="game-meta"><span class="tag">{{CATEGORY}}</span>{{KEYWORD_TAGS}}</div></div><p class="game-desc">{{DESCRIPTION}}</p></article>{{RELATED_SECTION}}</div></main>

  <script>(function(){var frame=document.getElementById('game-frame'),splash=document.getElementById('splash'),shell=document.getElementById('game-shell'),fsBtn=document.getElementById('fs-btn');frame.addEventListener('load',function(){splash.classList.add('loaded')});setTimeout(function(){splash.classList.add('loaded')},6000);function full(){return document.fullscreenElement===shell||document.webkitFullscreenElement===shell}function sync(){var a=full();fsBtn.classList.toggle('is-fullscreen',a);fsBtn.setAttribute('aria-label',a?'Exit fullscreen':'Enter fullscreen');fsBtn.setAttribute('title',a?'Exit fullscreen':'Fullscreen')}fsBtn.addEventListener('click',function(){if(full()){if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();return}if(shell.requestFullscreen)shell.requestFullscreen();else if(shell.webkitRequestFullscreen)shell.webkitRequestFullscreen()});document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync)})();</script>
  {{THEME_SCRIPT}}
</body>
</html>
