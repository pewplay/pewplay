<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  {{HEAD_TAGS}}
  {{SEO_TAGS}}
  {{JSON_LD}}
  <style>
    {{STYLES}}

    /* HERO / SEARCH */
    .hero {
      padding: 32px 16px 16px;
      text-align: center;
    }
    .hero h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .hero p {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }
    .search-box {
      max-width: 420px;
      margin: 0 auto;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      background: #1a1a28;
      color: #e0e0e0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }
    .search-box input:focus { border-color: #6C5CE7; }
    .search-box input::placeholder { color: #555; }
    .search-box svg {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      color: #555;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      padding: 8px 16px 32px;
    }
    @media (min-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }

    .game-card {
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background: #1a1a28;
      text-decoration: none;
      display: block;
      transition: transform .15s, box-shadow .15s;
    }
    .game-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(108,92,231,.25);
    }
    .game-card:active { transform: scale(.96); }
    .game-card img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .game-card__name {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px 8px 8px;
      background: linear-gradient(transparent, rgba(0,0,0,.85));
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      color: #555;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">
      <img src="/icon-32.png" alt="">
      <span>{{SITE_NAME}}</span>
    </a>
  </header>

  <main>
    <section class="hero">
      <h1>{{SITE_TAGLINE}}</h1>
      <p>{{GAMES_COUNT}} games — play instantly in your browser</p>
      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" id="search" placeholder="Search games…" autocomplete="off">
      </div>
    </section>

    <div class="grid" id="grid">
      {{GAMES_LIST}}
    </div>
  </main>

  <script>
    (function(){
      const games = {{GAMES_JSON}};
      const grid  = document.getElementById('grid');
      const input = document.getElementById('search');
      const orig  = grid.innerHTML;

      input.addEventListener('input', function() {
        const q = this.value.trim().toLowerCase();
        if (!q) { grid.innerHTML = orig; return; }
        const hits = games.filter(g => g.n.toLowerCase().includes(q));
        if (!hits.length) {
          grid.innerHTML = '<div class="no-results">No games found</div>';
          return;
        }
        grid.innerHTML = hits.map(g =>
          '<a href="'+g.u+'" class="game-card" aria-label="Play '+g.n+'">' +
          '<img src="'+g.i+'" alt="'+g.n+'" loading="lazy" width="400" height="400">' +
          '<span class="game-card__name">'+g.n+'</span></a>'
        ).join('');
      });
    })();
  </script>
</body>
</html>
